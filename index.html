  <style>
    :root {
      --bg: #100018;
      --purple: #20072e;
      --purple-light: #371044;
      --gold: #ffe59a;
      --gold-dark: #bd8a28;
      --green: #08d878;
      --green-dark: #00a878;
      --white: #ffffff;
      --muted: #c5bdcc;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 22px;
      overflow-x: hidden;
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(
          ellipse at 50% 43%,
          rgba(81, 17, 111, .30) 0%,
          rgba(39, 8, 54, .17) 36%,
          transparent 68%
        ),
        linear-gradient(
          180deg,
          #0b0011 0%,
          #16051f 50%,
          #0b0012 100%
        );
    }

    .landing {
      width: 100%;
      max-width: 460px;
      text-align: center;
      animation: appear .85s ease-out both;
    }

    .brand {
      margin: 0 auto 49px;
      animation: brandAppear 1s ease-out both;
    }

    .brand-top {
      margin-bottom: 7px;
      color: var(--gold);
      font-size: clamp(13px, 3.5vw, 17px);
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .brand-name {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f8f5fb;
      font-size: clamp(38px, 10.5vw, 59px);
      font-weight: 1000;
      letter-spacing: -2.5px;
      line-height: .98;
      text-shadow:
        0 2px 0 #9b92a6,
        0 4px 0 #4c4357,
        0 7px 16px rgba(0, 0, 0, .7);
    }

    .brand-name .spade {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: .79em;
      height: .95em;
      margin: 0 -1px;
      color: #e9d5ff;
      font-size: 1.06em;
      text-shadow:
        0 0 5px #9e48e9,
        0 0 15px rgba(163, 72, 234, .5);
      transform: translateY(-1px);
    }

    .brand-net {
      margin-top: 12px;
      padding-left: 7px;
      color: var(--gold);
      font-size: clamp(14px, 4vw, 23px);
      font-weight: 900;
      letter-spacing: clamp(8px, 2.5vw, 14px);
      text-align: right;
      text-shadow: 0 0 12px rgba(255, 210, 87, .2);
    }

    .brand-caption {
      margin-top: 11px;
      color: #e5dbea;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .ticket-wrap {
      position: relative;
      margin: 0 0 42px;
      padding: 9px;
      border: 1px solid rgba(255, 219, 100, .24);
      border-radius: 23px;
      background: linear-gradient(135deg, #3b3427, #75602d, #29201b);
      box-shadow:
        0 0 0 2px rgba(255, 217, 112, .08),
        0 15px 34px rgba(0, 0, 0, .42),
        0 0 35px rgba(244, 183, 49, .10);
      animation: ticketFloat 4s ease-in-out infinite;
    }

    .ticket {
      position: relative;
      min-height: 236px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 27px 15px;
      overflow: hidden;
      border: 2px solid #d8a938;
      border-radius: 15px;
      color: #301b31;
      background:
        radial-gradient(
          ellipse at 50% 0%,
          rgba(255, 255, 255, .8),
          transparent 47%
        ),
        linear-gradient(
          130deg,
          #fff0a8 0%,
          #f8df86 28%,
          #ffedab 52%,
          #d9ad45 100%
        );
      box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .2);
    }

    .ticket::before,
    .ticket::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 28px;
      height: 42px;
      border-radius: 50%;
      background: #190520;
      transform: translateY(-50%);
    }

    .ticket::before {
      left: -20px;
    }

    .ticket::after {
      right: -20px;
    }

    .ticket-label {
      margin-bottom: 15px;
      color: #60451a;
      font-size: clamp(10px, 3vw, 13px);
      font-weight: 900;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    .ticket h1 {
      margin: 0;
      color: #30183d;
      font-size: clamp(57px, 17vw, 83px);
      font-weight: 1000;
      letter-spacing: -4px;
      line-height: .98;
      text-shadow: 0 2px 0 rgba(255, 255, 255, .3);
    }

    .ticket-subtitle {
      margin-top: 12px;
      color: #49304c;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .ticket-code {
      margin-top: 20px;
      padding: 10px 18px;
      border: 2px dashed rgba(79, 48, 33, .55);
      color: #674d26;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .description {
      margin: 0 auto 42px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
      font-weight: 400;
    }

    .cta {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: min(100%, 420px);
      min-height: 76px;
      margin: 0 auto;
      padding: 18px 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .24);
      border-radius: 50px;
      background: linear-gradient(
        115deg,
        #12d879 0%,
        #05c985 45%,
        #079f88 100%
      );
      color: #ffffff;
      font-size: clamp(14px, 4vw, 19px);
      font-weight: 900;
      text-decoration: none;
      text-align: center;
      box-shadow:
        0 5px 0 rgba(0, 104, 70, .9),
        0 12px 30px rgba(0, 211, 129, .22),
        inset 0 1px 1px rgba(255, 255, 255, .35);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition:
        transform .2s ease,
        box-shadow .2s ease,
        filter .2s ease;
      animation: buttonGlow 2.7s ease-in-out infinite;
    }

    .cta::before {
      content: "";
      position: absolute;
      top: -40%;
      left: -70%;
      width: 40%;
      height: 180%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, .22),
        transparent
      );
      transform: rotate(22deg);
      animation: shine 4s ease-in-out infinite;
      pointer-events: none;
    }

    .cta:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
      box-shadow:
        0 7px 0 rgba(0, 104, 70, .9),
        0 15px 34px rgba(0, 211, 129, .3);
    }

    .cta:active {
      transform: translateY(2px) scale(.99);
      box-shadow:
        0 2px 0 rgba(0, 104, 70, .9),
        0 6px 16px rgba(0, 211, 129, .16);
    }

    .whatsapp-icon {
      flex: 0 0 auto;
      width: 27px;
      height: 27px;
    }

    .fineprint {
      margin: 47px 0 0;
      color: #8f829b;
      font-size: 14px;
      line-height: 1.5;
      letter-spacing: .5px;
    }

    .fineprint strong {
      color: #b3a5bd;
      font-weight: 400;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes brandAppear {
      from {
        opacity: 0;
        transform: translateY(-12px) scale(.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes ticketFloat {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-4px);
      }
    }

    @keyframes buttonGlow {
      0%, 100% {
        box-shadow:
          0 5px 0 rgba(0, 104, 70, .9),
          0 12px 26px rgba(0, 211, 129, .18),
          inset 0 1px 1px rgba(255, 255, 255, .35);
      }
      50% {
        box-shadow:
          0 5px 0 rgba(0, 104, 70, .9),
          0 12px 35px rgba(0, 230, 144, .34),
          inset 0 1px 1px rgba(255, 255, 255, .4);
      }
    }

    @keyframes shine {
      0%, 35% {
        left: -70%;
      }
      65%, 100% {
        left: 140%;
      }
    }

    @media (max-width: 390px) {
      body {
        padding: 22px 20px;
      }

      .brand {
        margin-bottom: 44px;
      }

      .ticket {
        min-height: 218px;
      }

      .description {
        margin-bottom: 40px;
        font-size: 16px;
      }

      .cta {
        min-height: 72px;
      }

      .fineprint {
        margin-top: 43px;
      }
    }

    @media (max-height: 740px) {
      body {
        align-items: flex-start;
      }

      .landing {
        padding-top: 10px;
        padding-bottom: 10px;
      }

      .brand {
        margin-bottom: 28px;
      }

      .ticket {
        min-height: 195px;
      }

      .ticket-wrap {
        margin-bottom: 28px;
      }

      .description {
        margin-bottom: 27px;
      }

      .fineprint {
        margin-top: 30px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

      <span>RECLAMAR MI BONO</span>

    <p class="fineprint">
      <strong>+18</strong> │ JUEGA CON RESPONSABILIDAD
    </p>
  </main>

  <script>
    (function () {
      "use strict";

      const WHATSAPP_NUMBER = "5492612694405";
      const button = document.getElementById("claimButton");

      let clickInProgress = false;

      function createReference() {
        const bytes = new Uint8Array(8);

        if (
          window.crypto &&
          typeof window.crypto.getRandomValues === "function"
        ) {
          window.crypto.getRandomValues(bytes);

          return Array.from(bytes, function (byte) {
            return byte.toString(16).padStart(2, "0");
          }).join("").toUpperCase();
        }

        return (
          Date.now().toString(16) +
          Math.random().toString(16).slice(2, 10)
        ).slice(0, 16).toUpperCase();
      }

      button.addEventListener("click", function (event) {
        event.preventDefault();

        if (clickInProgress) return;
        clickInProgress = true;

        const reference = createReference();

        const message =
          "Hola, quiero consultar las condiciones del bono del 60%. " +
          "Ref: " + reference;

        const whatsappURL =
          "https://wa.me/" +
          WHATSAPP_NUMBER +
          "?text=" +
          encodeURIComponent(message);

        // Evento personalizado: solo al pulsar el botón.
        if (typeof window.fbq === "function") {
          window.fbq(
            "trackCustom",
            "BonusClaimClick",
            {
              landing_reference: reference
            }
          );
        }

        window.location.assign(whatsappURL);
      });
    })();
  </script>

</html>
