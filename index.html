  border-radius:50%;

   BONO

   BOTÓN CHAT

.wa-btn{

      #C9A227,
      #D4AF37,

  border:none;

  border-radius:14px;

  font-weight:800;

  width:100%;

  cursor:pointer;

  box-shadow:
    0 8px 28px
    rgba(212,175,55,0.45);

  animation:
    shake 2.8s ease-in-out infinite,
    glowBtn 2s ease-in-out infinite;

}


.wa-btn:active{

  transform:scale(0.97);

  animation:none;

}


.wa-btn svg{

  width:24px;

  height:24px;

  fill:#1a1a1a;

}

   FOOTER
   ========================================================= */

  text-align:center;

  margin-top:10px;

  font-size:12px;

  color:#888;

}


/* =========================================================
   ANIMACIONES
   ========================================================= */

@keyframes shake{

  0%,
  100%{

    transform:translateX(0);

  }

  8%{

    transform:translateX(-4px);

  }

  16%{

    transform:translateX(4px);

  }

  24%{

    transform:translateX(-3px);

  }

  32%{

    transform:translateX(3px);

  }

  40%{

    transform:translateX(0);

  }

}

  100%{

      0 8px 28px

  50%{

<script>

/* =========================================================
   ELEMENTOS
   ========================================================= */

const frame =
  document.getElementById(
    'kommoChatFrame'
  );


const closeBtn =
  document.getElementById(
    'kommoClose'
  );


const openBtn =
  document.getElementById(
    'openChatBtn'
  );


let ready = false;


/* =========================================================
   ABRIR CHATWEB
     
   IMPORTANTE:
     
   NO fbq()
   NO Contact
   NO ClickWhatsAppButton
     
   Abrir el ChatWeb NO genera ninguna
   conversión de Meta.
   ========================================================= */

function openReal(){

  frame.classList.add(
    'is-open'
  );


  closeBtn.classList.add(
    'is-open'
  );


  try{

    crmPlugin(
      'runChatShow'
    );


    console.log(
      '✅ ChatWeb Kommo abierto'
    );


  }catch(error){

    console.error(
      '❌ Error abriendo ChatWeb Kommo:',
      error
    );

  }

}


/* =========================================================
   ABRIR MANUALMENTE
     
   Este botón solamente vuelve a abrir
   el ChatWeb si fue cerrado.
     
   NO dispara ningún evento Meta.
   ========================================================= */

function openChat(){

  if(!ready){

    console.log(
      '⏳ Kommo todavía no está listo'
    );

    return;

  }


  openReal();

}


/* =========================================================
   CERRAR CHAT
   ========================================================= */

function closeChat(){

  frame.classList.remove(
    'is-open'
  );


  closeBtn.classList.remove(
    'is-open'
  );


  try{

    crmPlugin(
      'runChatHide'
    );

  }catch(error){}

}


/* =========================================================
   ESPERAR A KOMMO
   ========================================================= */

function bind(){

  if(
    typeof crmPlugin !==
    'function'
  ){

    setTimeout(
      bind,
      150
    );

    return;

  }


  console.log(
    '⏳ Esperando ChatWeb Kommo...'
  );


  crmPlugin(
    'onChatReady',
    function(){

      ready = true;


      console.log(
        '✅ ChatWeb Kommo listo'
      );


      /* ===================================================
         APERTURA AUTOMÁTICA
         
         EXACTAMENTE 300 ms DESPUÉS
         DE QUE KOMMO ESTÉ LISTO.
         
         NO GENERA CONTACT.
         =================================================== */

      setTimeout(
        function(){

          openReal();

        },
        300
      );

    }
  );

}


/* =========================================================
   BOTONES
   ========================================================= */

openBtn.addEventListener(
  'click',
  openChat
);


closeBtn.addEventListener(
  'click',
  closeChat
);


/* =========================================================
   INICIAR
   ========================================================= */

bind();

</script>
