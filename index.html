<style>

/* =========================================================
   RESET
   ========================================================= */

*{

  margin:0;

  padding:0;

  box-sizing:border-box;

}


/* =========================================================
   HTML / BODY
   ========================================================= */

html,
body{

  width:100%;

  height:100%;

  overflow:hidden;

  background:#0a0a0a;

}


/* =========================================================
   CHATWEB
   ========================================================= */

#kommoChatFrame{

  position:fixed;

  inset:0;

  width:100%;

  height:100%;

  background:#0a0a0a;

  visibility:hidden;

  opacity:0;

  transition:
    opacity 0.1s ease,
    visibility 0.1s ease;

  z-index:9999;

}


/* =========================================================
   CHAT ABIERTO
   ========================================================= */

#kommoChatFrame.is-open{

  visibility:visible;

  opacity:1;

}


/* =========================================================
   IFRAME KOMMO
   ========================================================= */

#kommoChatFrame iframe{

  width:100% !important;

  height:100% !important;

  border:0 !important;

  display:block !important;

}


/* =========================================================
   ESTADO DE CARGA
   ========================================================= */

#loading{

  position:fixed;

  inset:0;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#0a0a0a;

  color:#aaa;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  font-size:14px;

  z-index:9998;

}


#loading.hidden{

  display:none;

}


/* =========================================================
   SPINNER
   ========================================================= */

.spinner{

  width:22px;

  height:22px;

  border:

    2px solid
    rgba(212,175,55,0.20);

  border-top-color:#D4AF37;

  border-radius:50%;

  animation:
    spin 0.8s linear infinite;

}


@keyframes spin{

  to{

    transform:rotate(360deg);

  }

}

</style>

</head>


<body>


<!-- =========================================================
     CARGANDO CHAT
     ========================================================= -->

<div id="loading">

  <div class="spinner"></div>

</div>


<!-- =========================================================
     CONTENEDOR CHATWEB
     ========================================================= -->

<div id="kommoChatFrame"></div>


<script>

/* =========================================================
   ELEMENTOS
   ========================================================= */

const frame =
  document.getElementById(
    'kommoChatFrame'
  );


const loading =
  document.getElementById(
    'loading'
  );


let ready = false;


/* =========================================================
   ABRIR CHATWEB
   ========================================================= */

function openChat(){

  if(!ready){

    console.log(
      '⏳ KOMMO TODAVÍA NO ESTÁ LISTO'
    );

    return;

  }


  /*
   * Mostrar ChatWeb.
   */

  frame.classList.add(
    'is-open'
  );


  /*
   * Ocultar pantalla de carga.
   */

  loading.classList.add(
    'hidden'
  );


  /*
   * Abrir ChatWeb Kommo.
   */

  try{

    crmPlugin(
      'runChatShow'
    );


    console.log(
      '✅ 1GIROX CHATWEB ABIERTO AUTOMÁTICAMENTE'
    );

    console.log(
      '✅ CONVERSIÓN SERÁ PROCESADA POR CLOUDFLARE AL RECIBIR MENSAJE'
    );


  }catch(error){

    console.error(
      '❌ ERROR ABRIENDO CHATWEB 1GIROX:',
      error
    );

  }

}


/* =========================================================
   ESPERAR A KOMMO
   ========================================================= */

function bind(){

  if(
    typeof crmPlugin !==
    'function'
  ){

    setTimeout(
      bind,
      100
    );

    return;

  }


  console.log(
    '⏳ ESPERANDO CHATWEB 1GIROX...'
  );


  crmPlugin(
    'onChatReady',
    function(){

      ready = true;


      console.log(
        '✅ CHATWEB 1GIROX LISTO'
      );


      /*
       * Abrir inmediatamente.
       */

      openChat();

    }
  );

}


/* =========================================================
   INICIAR
   ========================================================= */

bind();

</script>


</body>
</html>
