<style>

/* =========================================================
   RESET
   ========================================================= */

*{

  margin:0;

  padding:0;

  box-sizing:border-box;

}


/* =========================================================
   BODY
   ========================================================= */

html,
body{

  width:100%;

  height:100%;

  overflow:hidden;

  background:#0a0a0a;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

}


/* =========================================================
   CHAT FRAME
   ========================================================= */

#kommoChatFrame{

  position:fixed;

  inset:0;

  width:100%;

  height:100%;

  background:#0a0a0a;

  visibility:visible;

  opacity:1;

  z-index:9999;

}


#kommoChatFrame iframe{

  width:100% !important;

  height:100% !important;

  border:0 !important;

}


/* =========================================================
   LOADING
   ========================================================= */

#chatLoading{

  position:fixed;

  inset:0;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  background:#0a0a0a;

  color:#fff;

  z-index:10000;

  transition:
    opacity .25s ease,
    visibility .25s ease;

}


#chatLoading.hidden{

  opacity:0;

  visibility:hidden;

  pointer-events:none;

}


/* =========================================================
   SPINNER
   ========================================================= */

.spinner{

  width:38px;

  height:38px;

  border:

    3px solid
    rgba(212,175,55,0.20);

  border-top-color:#D4AF37;

  border-radius:50%;

  animation:
    spin .8s linear infinite;

  margin-bottom:14px;

}


.loadingText{

  font-size:14px;

  color:#aaa;

  letter-spacing:.2px;

}


/* =========================================================
   ANIMACIÓN
   ========================================================= */

@keyframes spin{

  from{

    transform:rotate(0deg);

  }

  to{

    transform:rotate(360deg);

  }

}

</style>

</head>


<body>


<!-- =========================================================
     CHATWEB
     ========================================================= -->

<div id="kommoChatFrame"></div>


<!-- =========================================================
     CARGANDO CHAT
     ========================================================= -->

<div id="chatLoading">

  <div class="spinner"></div>

  <div class="loadingText">

    Cargando chat...

  </div>

</div>


<script>

/* =========================================================
   ELEMENTOS
   ========================================================= */

const frame =
  document.getElementById(
    'kommoChatFrame'
  );


const loading =
  document.getElementById(
    'chatLoading'
  );


/* =========================================================
   OCULTAR LOADING
   ========================================================= */

function hideLoading(){

  loading.classList.add(
    'hidden'
  );

}


/* =========================================================
   ABRIR CHATWEB
   ========================================================= */

function openChatWeb(){

  try{

    crmPlugin(
      'runChatShow'
    );


    console.log(
      '========================================'
    );

    console.log(
      '✅ 1GIROX CHATWEB ABIERTO'
    );

    console.log(
      '🚫 NO CONTACT'
    );

    console.log(
      '🚫 NO EVENTO DESDE NAVEGADOR'
    );

    console.log(
      '========================================'
    );


    /*
     * Esperamos un momento para permitir
     * que Kommo inserte el iframe.
     */

    setTimeout(
      watchIframe,
      100
    );


  }catch(error){

    console.error(
      '❌ ERROR ABRIENDO CHATWEB:',
      error
    );

  }

}


/* =========================================================
   DETECTAR IFRAME
   ========================================================= */

function watchIframe(){

  const iframe =
    frame.querySelector(
      'iframe'
    );


  if(iframe){

    console.log(
      '✅ IFRAME CHATWEB DETECTADO'
    );


    iframe.addEventListener(
      'load',
      function(){

        console.log(
          '✅ CHATWEB TERMINÓ DE CARGAR'
        );

        hideLoading();

      }
    );


    /*
     * Fallback por si el iframe
     * ya estaba cargado.
     */

    setTimeout(
      hideLoading,
      1200
    );


    return;

  }


  /*
   * Todavía no existe el iframe.
   * Seguimos esperando.
   */

  setTimeout(
    watchIframe,
    100
  );

}


/* =========================================================
   ESPERAR A KOMMO
   ========================================================= */

function bindKommo(){

  if(
    typeof crmPlugin !==
    'function'
  ){

    setTimeout(
      bindKommo,
      100
    );

    return;

  }


  console.log(
    '⏳ ESPERANDO CHATWEB 1GIROX...'
  );


  crmPlugin(
    'onChatReady',
    function(){

      console.log(
        '✅ KOMMO CHATWEB LISTO'
      );


      /*
       * ABRIR AUTOMÁTICAMENTE
       *
       * No hay botón.
       * No hay landing.
       * No hay Contact.
       */

      openChatWeb();

    }
  );

}


/* =========================================================
   INICIAR
   ========================================================= */

bindKommo();

</script>


</body>
